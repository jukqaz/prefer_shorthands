# analyzer 14 toolchain. Kept as an analyzer plugin (analysis_options `plugins:` path entry).
name: prefer_shorthands
description: An analyzer plugin that suggests using Dart's dot shorthand syntax.
homepage: https://github.com/huanghui1998hhh/prefer_shorthands
version: 0.4.7+analyzer14

keywords:
  - dart
  - shorthand
  - dot-shorthand
  - analyzer-plugin
  - linter
  - quick-fix

environment:
  sdk: ^3.10.0-0

dependencies:
  analysis_server_plugin: ^0.3.22 # vendored: follows analyzer 14
  analyzer: '>=13.0.0 <15.0.0' # vendored: widened from <10
  analyzer_plugin: ^0.14.0 # vendored: 0.13 -> 0.14 (analyzer 13+ line)
  meta: ^1.3.0
  yaml: ^3.1.3

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
  coverage: ^1.8.0
  
